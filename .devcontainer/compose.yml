services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    working_dir: /workspaces/litestar-base
    volumes:
      - ..:/workspaces/litestar-base
    environment:
      UVICORN_HOST: 0.0.0.0
      UV_PROJECT_ENVIRONMENT: /home/vscode/.venvs/litestar-base
      DATABASE_URL: postgresql://litestar:litestar@postgres:5432/litestar
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: litestar
      POSTGRES_PASSWORD: litestar
      POSTGRES_DB: litestar
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
